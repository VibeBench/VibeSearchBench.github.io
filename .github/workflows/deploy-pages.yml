# Pushes a static build to the gh-pages branch (no configure-pages / OIDC needed).
# One-time: Settings → Pages → Deploy from a branch → gh-pages → / (root) → Save
name: Publish site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          set -euo pipefail
          mkdir -p _site/data/trajs
          cp index.html results.html _site/
          cp -r assets _site/
          cp data/leaderboard.json data/tasks_index.json _site/data/
          cp -r data/trajs/daily data/trajs/pro _site/data/trajs/
          touch _site/.nojekyll
          du -sh _site

      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
